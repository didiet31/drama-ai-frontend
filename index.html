<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drama AI Film Maker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: #ccc;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #e94560;
        }

        input::placeholder {
            color: #666;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .progress-container {
            display: none;
            margin-top: 20px;
        }

        .progress-container.active {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            border-radius: 5px;
            transition: width 0.5s;
            width: 0%;
        }

        .progress-text {
            text-align: center;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #ccc;
        }

        .result {
            display: none;
            margin-top: 20px;
            text-align: center;
        }

        .result.active {
            display: block;
        }

        .video-placeholder {
            width: 100%;
            aspect-ratio: 16/9;
            background: rgba(0,0,0,0.5);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            margin-bottom: 15px;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-queued { background: #f39c12; color: #000; }
        .status-processing { background: #3498db; color: #fff; }
        .status-completed { background: #2ecc71; color: #fff; }
        .status-failed { background: #e74c3c; color: #fff; }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #666;
            font-size: 0.8rem;
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.5rem; }
            .card { padding: 15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Drama AI Film Maker</h1>
        <p class="subtitle">Ubah judul menjadi film drama China</p>

        <!-- Form Input -->
        <div class="card" id="formCard">
            <div class="form-group">
                <label for="title">Judul Drama</label>
                <input type="text" id="title" placeholder="Contoh: Cinta Terlarang di Dinasti Ming">
            </div>

            <div class="form-group">
                <label for="genre">Genre</label>
                <select id="genre">
                    <option value="romance">Romance</option>
                    <option value="historical">Historical</option>
                    <option value="modern">Modern</option>
                    <option value="fantasy">Fantasy</option>
                </select>
            </div>

            <div class="form-group">
                <label for="duration">Durasi (menit)</label>
                <select id="duration">
                    <option value="60">1 menit</option>
                    <option value="180" selected>3 menit</option>
                    <option value="300">5 menit</option>
                    <option value="600">10 menit</option>
                </select>
            </div>

            <button class="btn btn-primary" id="generateBtn" onclick="startGeneration()">
                ✨ Generate Film
            </button>

            <!-- Progress -->
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">Menunggu...</div>
            </div>

            <!-- Result -->
            <div class="result" id="resultContainer">
                <span class="status-badge" id="statusBadge">Completed</span>
                <div class="video-placeholder" id="videoPlaceholder">
                    🎥 Video akan muncul di sini
                </div>
                <p id="resultMessage">Film Anda siap!</p>
            </div>
        </div>

        <div class="footer">
            Powered by AI • Render + Vercel • v1.0.0
        </div>
    </div>

    <script>
        // GANTI INI DENGAN URL BACKEND ANDA
        const API_URL = 'https://drama-ai-api.onrender.com';  // ← GANTI!
        
        let taskId = null;
        let ws = null;

        async function startGeneration() {
            const title = document.getElementById('title').value;
            const genre = document.getElementById('genre').value;
            const duration = parseInt(document.getElementById('duration').value);

            if (!title.trim()) {
                alert('Masukkan judul drama terlebih dahulu!');
                return;
            }

            // UI: Loading state
            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Memproses...';

            // Show progress
            document.getElementById('progressContainer').classList.add('active');
            document.getElementById('resultContainer').classList.remove('active');

            try {
                // 1. Kirim request ke backend
                const response = await fetch(`${API_URL}/api/v1/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: title,
                        genre: genre,
                        duration: duration,
                        characters: [
                            {
                                name: "Protagonis",
                                gender: "female",
                                age: 25,
                                appearance: "Wanita Tiongkok cantik"
                            }
                        ]
                    })
                });

                const data = await response.json();
                taskId = data.task_id;

                // 2. Start WebSocket untuk real-time progress
                connectWebSocket(taskId);

                // 3. Untuk demo: trigger simulasi (nanti hapus ini)
                setTimeout(() => {
                    fetch(`${API_URL}/api/v1/simulate/${taskId}`, { method: 'POST' });
                }, 1000);

            } catch (error) {
                console.error('Error:', error);
                alert('Gagal memulai generate: ' + error.message);
                resetUI();
            }
        }

        function connectWebSocket(taskId) {
            // Ganti ws:// dengan wss:// untuk HTTPS
            const wsUrl = API_URL.replace('https://', 'wss://').replace('http://', 'ws://');
            ws = new WebSocket(`${wsUrl}/ws/${taskId}`);

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                updateProgress(data);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                // Fallback: polling
                startPolling(taskId);
            };

            ws.onclose = () => {
                console.log('WebSocket closed');
            };
        }

        function startPolling(taskId) {
            // Fallback kalau WebSocket gagal
            const interval = setInterval(async () => {
                try {
                    const response = await fetch(`${API_URL}/api/v1/status/${taskId}`);
                    const data = await response.json();
                    updateProgress(data);

                    if (data.status === 'completed' || data.status === 'failed') {
                        clearInterval(interval);
                    }
                } catch (e) {
                    console.error('Polling error:', e);
                }
            }, 3000);
        }

        function updateProgress(data) {
            const fill = document.getElementById('progressFill');
            const text = document.getElementById('progressText');

            fill.style.width = data.progress + '%';
            text.textContent = `${data.progress}% - ${data.message}`;

            if (data.status === 'completed') {
                showResult(data, 'success');
            } else if (data.status === 'failed') {
                showResult(data, 'error');
            }
        }

        function showResult(data, type) {
            const result = document.getElementById('resultContainer');
            const badge = document.getElementById('statusBadge');
            const message = document.getElementById('resultMessage');

            result.classList.add('active');
            
            if (type === 'success') {
                badge.className = 'status-badge status-completed';
                badge.textContent = '✅ Selesai';
                message.textContent = `Film "${data.title || 'Anda'}" siap ditonton!`;
            } else {
                badge.className = 'status-badge status-failed';
                badge.textContent = '❌ Gagal';
                message.textContent = data.error || 'Terjadi kesalahan';
            }

            resetUI();
        }

        function resetUI() {
            const btn = document.getElementById('generateBtn');
            btn.disabled = false;
            btn.textContent = '✨ Generate Film';
        }

        // Test connection saat load
        window.onload = async () => {
            try {
                const response = await fetch(`${API_URL}/health`);
                if (response.ok) {
                    console.log('✅ Backend connected');
                }
            } catch (e) {
                console.error('❌ Backend not reachable:', e);
            }
        };
    </script>
</body>
</html>
